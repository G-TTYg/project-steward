name: Validate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  package-and-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Package, links, and exported CLI smoke
        run: python -X utf8 tools/check_package.py --repository .
      - name: State, Git, fault recovery, and evaluation fixture regressions
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Whitespace
        run: git diff --check
